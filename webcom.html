<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Secret Chat Zero Server</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #121212;
            --text: #ff8c00;
            --highlight: #ffb347;
            --glow: rgba(255, 140, 0, 0.3);
            --scanline: rgba(255, 140, 0, 0.03);
            --border: #ff8c00;
            --font-mono: 'Courier New', monospace;
            --font-sans: 'Segoe UI', system-ui, sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            min-height:100vh;
            overflow-x:hidden;
            position:relative;
            -webkit-tap-highlight-color: transparent;
        }
        body::before {
            content:"";
            position:fixed; top:0;left:0;width:100%;height:100%;
            pointer-events:none;z-index:999;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
            background-repeat:repeat; opacity:0.05;
        }
        body::after {
            content:"";
            position:fixed; top:0; left:0; width:100%; height:100%;
            pointer-events:none;z-index:998;
            background: repeating-linear-gradient(0deg, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 3px);
            animation: scanline-move 8s linear infinite;
        }
        @keyframes scanline-move { 0%{ transform:translateY(0); } 100%{ transform:translateY(4px); } }
        .particles {
            position:fixed; top:0; left:0; width:100%; height:100%;
            pointer-events:none; z-index:0;
        }
        .particle {
            position:absolute;
            width:2px; height:2px;
            background:var(--highlight);
            border-radius:50%;
            animation: float-up linear infinite;
            opacity:0.6;
        }
        @keyframes float-up {
            0% { transform:translateY(100vh) scale(0); opacity:0; }
            10% { opacity:1; }
            90% { opacity:1; }
            100% { transform:translateY(-10vh) scale(1.5); opacity:0; }
        }
        .app-container {
            position:relative; z-index:1;
            max-width:1200px; margin:0 auto; padding:10px;
            display:flex; flex-direction:column; height:100vh;
        }
        header {
            display:flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: var(--panel);
            border:1px solid var(--border);
            clip-path: polygon(0 0, 100% 0, 98% 100%, 2% 100%);
            margin-bottom:10px;
            box-shadow: 0 0 15px var(--glow);
            flex-wrap: wrap;
        }
        .logo {
            font-family: var(--font-mono); font-size:1.3rem;
            text-transform: uppercase; letter-spacing: 2px;
            color: var(--highlight); text-shadow: 0 0 10px var(--glow);
        }
        .lang-selector { display:flex; gap:8px; }
        .lang-btn {
            background:transparent; border:1px solid var(--border);
            color:var(--text); padding:4px 12px; cursor:pointer;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
            font-family: var(--font-mono); font-size:0.8rem; transition: all 0.2s;
        }
        .lang-btn.active, .lang-btn:hover { background:var(--highlight); color:#000; box-shadow:0 0 10px var(--glow); }
        .debug-panel {
            background:var(--panel); border:1px solid var(--border);
            padding:6px 14px; font-family: var(--font-mono); font-size:0.7rem;
            color: var(--highlight); margin-bottom:6px;
            clip-path: polygon(2% 0, 100% 0, 98% 100%, 0 100%);
            opacity:0.9;
            word-break: break-all;
        }
        .identity-panel {
            background:var(--panel); border:1px solid var(--border);
            padding:14px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
            clip-path: polygon(0 0, 100% 0, 98% 100%, 2% 100%);
            margin-bottom:10px;
        }
        .identity-info { flex:1; font-family: var(--font-mono); }
        .identity-name { font-size:1.1rem; color:var(--highlight); text-shadow:0 0 8px var(--glow); }
        .fingerprint { font-size:0.85rem; color:var(--text); }
        .btn {
            background:transparent; border:1px solid var(--border);
            color:var(--text); padding:8px 18px; cursor:pointer;
            clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
            font-family: var(--font-mono); font-size:0.8rem; transition: all 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover { background:var(--highlight); color:#000; box-shadow:0 0 15px var(--glow); transform:scale(1.02); }
        .btn:active { transform:scale(0.98); }
        .btn.primary { background:var(--highlight); color:#000; font-weight:bold; }
        .main-content {
            flex:1; background:var(--panel); border:1px solid var(--border);
            padding:15px; overflow-y:auto;
            clip-path: polygon(0 0, 100% 0, 99% 100%, 1% 100%);
            display:flex; flex-direction:column;
        }
        .home-actions {
            display:flex; gap:20px; justify-content:center; align-items:center;
            flex-wrap:wrap; margin:auto;
        }
        .qr-container { text-align:center; margin:10px 0; }
        .qr-container canvas { background:white; padding:10px; border:2px solid var(--border); max-width:100%; height:auto; }
        .input-group { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }
        .input-field {
            flex:1; background: rgba(255,140,0,0.05); border:1px solid var(--border);
            color:var(--text); padding:10px; font-family: var(--font-mono);
            backdrop-filter: blur(4px);
            clip-path: polygon(2% 0, 100% 0, 98% 100%, 0 100%);
            min-width:200px;
            font-size: 0.9rem;
        }
        .input-field:focus { outline:none; border-color:var(--highlight); box-shadow:0 0 10px var(--glow); }
        .chat-area { flex:1; display:flex; flex-direction:column; }
        .messages { flex:1; overflow-y:auto; padding:10px; font-family: var(--font-mono); }
        .msg-bubble {
            max-width:80%; margin:8px 0; padding:10px 14px;
            border-radius:8px; word-break:break-word; position:relative;
        }
        .msg-local { background: rgba(255,140,0,0.15); border-left:3px solid var(--highlight); margin-left:auto; }
        .msg-remote { background: rgba(0,200,200,0.1); border-right:3px solid cyan; margin-right:auto; }
        .msg-meta { font-size:0.65rem; opacity:0.7; margin-bottom:4px; }
        .msg-file { background:rgba(255,140,0,0.05); padding:10px; margin:5px 0; border:1px dashed var(--border); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .terminal-log {
            background:#0a0a0a; border:1px solid var(--border); padding:8px;
            font-family: var(--font-mono); font-size:0.7rem; height:120px;
            overflow-y:auto; margin-top:8px; color:var(--highlight);
            clip-path: polygon(2% 0, 100% 0, 98% 100%, 0 100%);
        }
        .log-entry { margin:2px 0; }
        .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; box-shadow:0 0 8px currentColor; }
        .dot-disconnected { background:#ff3333; color:#ff3333; }
        .dot-connecting { background:#ffcc00; color:#ffcc00; animation: pulse 1s infinite; }
        .dot-connected { background:#33ff33; color:#33ff33; box-shadow:0 0 12px #33ff33; }
        @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }
        @media (max-width: 768px) {
            .identity-panel { flex-direction:column; align-items:flex-start; }
            .home-actions { flex-direction:column; }
            .btn { padding:10px 15px; font-size:0.9rem; }
            .input-field { min-width: 100%; font-size: 1rem; }
            header { flex-direction: column; gap: 10px; }
            .logo { font-size:1.1rem; }
        }
    </style>
</head>

let currentLang = 'en';
function t(key) { return i18n[currentLang][key] || key; }
function setLang(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang===lang));
    renderUI();

// ==================== UTILS ====================
function logToTerminal(msg) {
    const term = document.getElementById('terminalLog');
    if (!term) return;
    const now = new Date().toTimeString().slice(0,8);
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.textContent = `[${now}] ${msg}`;
    term.appendChild(entry);
    term.scrollTop = term.scrollHeight;
}
function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => logToTerminal(t('copy')+' OK')).catch(() => alert('Copy failed'));
}
function downloadJSON(data, filename) {
    const blob = new Blob([JSON.stringify(data)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=filename; a.click();
    URL.revokeObjectURL(url);
}
function readFileAsJSON(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => { try{ resolve(JSON.parse(e.target.result)); } catch(ex){ reject(ex); } };
        reader.onerror = reject;
        reader.readAsText(file);
    });
}

// ==================== PARTICLES ====================
function createParticles() {
    const container = document.getElementById('particles');
    if (!container) return;
    for(let i=0; i<30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random()*100+'%';
        p.style.animationDuration = (Math.random()*10+8)+'s';
        p.style.animationDelay = Math.random()*5+'s';

}

// ==================== CRYPTO ====================
const CryptoHelper = {
    async generateECDHKeyPair() {
        return await crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveBits']);
    },
    async exportPublicKey(key) {
        const raw = await crypto.subtle.exportKey('raw', key.publicKey);
        return new Uint8Array(raw);
    },
    async importPublicKey(raw) {
        return await crypto.subtle.importKey('raw', raw, {name:'ECDH', namedCurve:'P-256'}, true, []);
    },
    async deriveSharedSecret(privateKey, publicKey) {
        const bits = await crypto.subtle.deriveBits({name:'ECDH', public:publicKey}, privateKey, 256);
        return new Uint8Array(bits);
    },
    async sha256(data) {
        return new Uint8Array(await crypto.subtle.digest('SHA-256', data));
    },
    async hkdf(ikm, salt, info, length=32) {
        const enc = new TextEncoder();
        const saltKey = await crypto.subtle.importKey('raw', salt, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
        const prk = await crypto.subtle.sign('HMAC', saltKey, ikm);
        const prkKey = await crypto.subtle.importKey('raw', prk, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
        const infoEnc = enc.encode(info);
        let t = new Uint8Array(0), ctr = 1;
        while(t.length < length) {
            const input = new Uint8Array([...t, ...infoEnc, ctr]);
            const block = new Uint8Array(await crypto.subtle.sign('HMAC', prkKey, input));
            t = new Uint8Array([...t, ...block]);
            ctr++;
        }
        return t.slice(0, length);
    },
    async deriveAESKey(sharedSecret) {
        const salt = new Uint8Array(32);
        const keyMaterial = await this.hkdf(sharedSecret, salt, 'secret-chat-zero-aes-key', 32);
        return await crypto.subtle.importKey('raw', keyMaterial, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
    },
    async encryptAES(key, plaintext) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ciphertext = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(plaintext));
        const ctArray = new Uint8Array(ciphertext);
        const result = new Uint8Array(iv.length + ctArray.length);
        result.set(iv); result.set(ctArray, iv.length);
        return result;
    },
    async decryptAES(key, data) {
        const iv = data.slice(0,12), ct = data.slice(12);
        const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
        return new TextDecoder().decode(plain);
    },
    async fingerprintFromPublicKey(pubRaw) {
        const hash = await this.sha256(pubRaw);
        const hex = Array.from(hash.slice(0,6)).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join('');
        return hex.match(/.{4}/g).join('-');
    },
    async sessionFingerprint(sharedSecret) {
        const hash = await this.sha256(sharedSecret);
        const hex = Array.from(hash.slice(0,6)).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join('');
        return hex.match(/.{4}/g).join('-');
    }
};

// ==================== IDENTITY MANAGER ====================
const IdentityManager = {
    adjectives: ['Shadow','Cyber','Ghost','Dark','Neon','Stealth','Crypto','Zero','Phantom','Digital','Silent','Quantum','Omega','Alpha','Nova'],
    animals: ['Fox','Tiger','Wolf','Hawk','Raven','Cobra','Viper','Panther','Eagle','Shark','Falcon','Lynx','Owl','Dragon','Scorpion'],
    generateName() {
        const adj = this.adjectives[Math.floor(Math.random()*this.adjectives.length)];
        const ani = this.animals[Math.floor(Math.random()*this.animals.length)];
        const suffix = Math.random().toString(16).slice(2,6).toUpperCase();
        return `${adj}${ani}-${suffix}`;
    },
    async loadOrCreate() {
        let stored = localStorage.getItem('scz_identity');
        if(stored) {
            try {
                const data = JSON.parse(stored);
                const privKey = await crypto.subtle.importKey('jwk', data.privateKeyJWK, {name:'ECDH', namedCurve:'P-256'}, true, ['deriveBits']);
                const pubKey = await crypto.subtle.importKey('jwk', data.publicKeyJWK, {name:'ECDH', namedCurve:'P-256'}, true, []);
                const pubRaw = await CryptoHelper.exportPublicKey({publicKey:pubKey});
                const fp = await CryptoHelper.fingerprintFromPublicKey(pubRaw);
                logToTerminal(t('identityLoaded'));
                return { identity: data.identity, keyPair: { privateKey: privKey, publicKey: pubKey }, fingerprint: fp };
            } catch(e){}
        }
        return await this.generateNew();
    },
    async generateNew() {
        const keyPair = await CryptoHelper.generateECDHKeyPair();
        const pubRaw = await CryptoHelper.exportPublicKey(keyPair);
        const fp = await CryptoHelper.fingerprintFromPublicKey(pubRaw);
        const identity = this.generateName();
        const jwkPriv = await crypto.subtle.exportKey('jwk', keyPair.privateKey);
        const jwkPub = await crypto.subtle.exportKey('jwk', keyPair.publicKey);
        localStorage.setItem('scz_identity', JSON.stringify({identity, publicKeyJWK: jwkPub, privateKeyJWK: jwkPriv}));
        logToTerminal(t('identityGenerated'));
        return { identity, keyPair, fingerprint: fp };
    }
};

// ==================== QR GENERATOR ====================
const QRGenerator = (function(){
    const QR_MODE_BYTE = 4, QR_ECLEVEL_M = 0;
    function createQR(text, canvas) {
        if (!canvas) return;
        const qr = new QRCode(-1, QR_ECLEVEL_M);
        qr.addData(text, QR_MODE_BYTE);
        qr.make();
        const size = qr.getModuleCount();
        canvas.width = canvas.height = size * 4 + 20;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = 'black';
        for (let row=0; row<size; row++) for (let col=0; col<size; col++) {
            if (qr.isDark(row, col)) ctx.fillRect(col*4+10, row*4+10, 4, 4);
        }
    }
    function QRCode(typeNumber, errorCorrectLevel) {
        this.typeNumber = typeNumber; this.errorCorrectLevel = errorCorrectLevel;
        this.modules = null; this.moduleCount = 0; this.dataCache = null; this.dataList = [];
    }
    QRCode.prototype = {
        addData: function(data, mode) { this.dataList.push(new QR8bitByte(data)); this.dataCache = null; },
        isDark: function(row, col) { return this.modules[row][col]; },
        getModuleCount: function() { return this.moduleCount; },
        make: function() {
            if (this.typeNumber <= 0) {
                let len = 0; for (let i=0; i<this.dataList.length; i++) len += this.dataList[i].getLength();
                for (let t=1; t<=40; t++) {
                    let blocks = QRRSBlock.getRSBlocks(t, QR_ECLEVEL_M), total=0;
                    for (let b of blocks) total += b.dataCount;
                    if (len <= total) { this.typeNumber = t; break; }
                }
                if (this.typeNumber <= 0) this.typeNumber = 40;
            }
            this.makeImpl(false, this.getBestMaskPattern());
        },
        makeImpl: function(test, maskPattern) {
            this.moduleCount = this.typeNumber * 4 + 17;
            this.modules = new Array(this.moduleCount);
            for (let row=0; row<this.moduleCount; row++) { this.modules[row] = new Array(this.moduleCount).fill(null); }
            this.setupPositionProbePattern(0,0);
            this.setupPositionProbePattern(this.moduleCount-7,0);
            this.setupPositionProbePattern(0,this.moduleCount-7);
            this.setupPositionAdjustPattern();
            this.setupTimingPattern();
            this.setupTypeInfo(test, maskPattern);
            if (this.typeNumber >= 7) this.setupTypeNumber(test);
            const data = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
            this.mapData(data, maskPattern);
        },
        setupPositionProbePattern: function(row, col) {
            for (let r=-1; r<=7; r++) for (let c=-1; c<=7; c++) {
                if (row+r<=-1 || this.moduleCount<=row+r || col+c<=-1 || this.moduleCount<=col+c) continue;
                if ((0<=r&&r<=6&&(c==0||c==6)) || (0<=c&&c<=6&&(r==0||r==6)) || (2<=r&&r<=4&&2<=c&&c<=4))
                    this.modules[row+r][col+c] = true;
                else this.modules[row+r][col+c] = false;
            }
        },
        getBestMaskPattern: function() { let min=0, pat=0; for (let i=0;i<8;i++){ this.makeImpl(true,i); let lp=QRUtil.getLostPoint(this); if(i==0||min>lp){min=lp;pat=i;} } return pat; },
        setupTimingPattern: function() {
            for (let r=8; r<this.moduleCount-8; r++) if (this.modules[r][6]==null) this.modules[r][6] = (r%2==0);
            for (let c=8; c<this.moduleCount-8; c++) if (this.modules[6][c]==null) this.modules[6][c] = (c%2==0);
        },
        setupPositionAdjustPattern: function() {
            const pos = QRUtil.getPatternPosition(this.typeNumber);
            for (let i=0; i<pos.length; i++) for (let j=0; j<pos.length; j++) {
                let row=pos[i], col=pos[j]; if (this.modules[row][col]!=null) continue;
                for (let r=-2; r<=2; r++) for (let c=-2; c<=2; c++) {
                    if (r==-2||r==2||c==-2||c==2||(r==0&&c==0)) this.modules[row+r][col+c] = true;
                    else this.modules[row+r][col+c] = false;
                }
            }
        },
        setupTypeNumber: function(test) {
            const bits = QRUtil.getBCHTypeNumber(this.typeNumber);
            for (let i=0; i<18; i++) { let mod = (!test && ((bits>>i)&1)==1); this.modules[Math.floor(i/3)][i%3+this.moduleCount-8-3] = mod; }
            for (let i=0; i<18; i++) { let mod = (!test && ((bits>>i)&1)==1); this.modules[i%3+this.moduleCount-8-3][Math.floor(i/3)] = mod; }
        },
        setupTypeInfo: function(test, maskPattern) {

// ==================== QR SCANNER ====================
const QRScanner = {
    async scanFromCamera(videoEl, timeout=30000) {
        if (!('BarcodeDetector' in window)) { logToTerminal(t('barcodeUnsupported')); return null; }
        try {
            const detector = new BarcodeDetector({formats:['qr_code']});
            const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
            videoEl.srcObject = stream;
            await videoEl.play();
            logToTerminal(t('scanningQR'));
            const start = Date.now();
            while (Date.now()-start < timeout) {
                const barcodes = await detector.detect(videoEl);
                if (barcodes.length>0) { stream.getTracks().forEach(t=>t.stop()); videoEl.srcObject=null; return barcodes[0].rawValue; }
                await new Promise(r=>setTimeout(r,100));
            }
            stream.getTracks().forEach(t=>t.stop()); videoEl.srcObject=null;
        } catch(e) { logToTerminal('Camera error: '+e.message); }
        return null;
    },
    async scanFromImage(file) {
        if (!('BarcodeDetector' in window)) throw new Error(t('barcodeUnsupported'));
        const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
        const detector = new BarcodeDetector({formats:['qr_code']});
        const barcodes = await detector.detect(img);
        URL.revokeObjectURL(img.src);
        return barcodes.length>0 ? barcodes[0].rawValue : null;
    }
};

function updateDebugInfo(state, gatheringState, connectionState) {
    const debug = document.getElementById('debugPanel');
    if (debug) {
        debug.textContent = `ICE gathering: ${gatheringState} | ICE conn: ${state} | Conn: ${connectionState}`;
    }
}

const WebRTCManager = {
    peerConnection: null, dataChannel: null,
    localEphemeralKeyPair: null, remoteEphemeralPublicKey: null,
    sharedSecret: null, aesKey: null, sessionFingerprint: null,
    onMessage: null, onStatusChange: null, onStats: null,
    stats: { rtt:0, sentBytes:0, recvBytes:0, messages:0, files:0, startTime:0 },
    async createOffer() {
        this.close();
        const pc = new RTCPeerConnection(ICE_SERVERS);
        this.peerConnection = pc;
        pc.onicecandidate = (e) => {
            if (e.candidate) {
                logToTerminal("ICE candidate: " + e.candidate.candidate);
            } else {
                logToTerminal("ICE Gathering Complete");
            }
        };
        pc.onicegatheringstatechange = () => {
            updateDebugInfo(pc.iceConnectionState, pc.iceGatheringState, pc.connectionState);
        };
        pc.oniceconnectionstatechange = () => {
            updateDebugInfo(pc.iceConnectionState, pc.iceGatheringState, pc.connectionState);
            if (this.onStatusChange) this.onStatusChange(pc.iceConnectionState);
        };
        pc.onconnectionstatechange = () => {
            updateDebugInfo(pc.iceConnectionState, pc.iceGatheringState, pc.connectionState);
        };

        const dc = pc.createDataChannel('secret', {ordered:true});
        this.setupDataChannel(dc);
        this.localEphemeralKeyPair = await CryptoHelper.generateECDHKeyPair();
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await new Promise((resolve) => {
            if (pc.iceGatheringState === 'complete') resolve();
            else {
                const timeout = setTimeout(() => { logToTerminal("ICE gathering timeout"); resolve(); }, 15000);
                pc.onicegatheringstatechange = () => { if(pc.iceGatheringState==='complete'){ clearTimeout(timeout); resolve(); } };
                pc.onicecandidate = (e) => { if(!e.candidate){ clearTimeout(timeout); resolve(); } };
            }
        });
        return { version:'1.0', type:'offer', sdp:pc.localDescription.sdp, senderIdentity: currentIdentity.identity, senderFingerprint: currentIdentity.fingerprint, timestamp: Date.now() };
    },
    async applyOffer(offerData) {
        this.close();
        const pc = new RTCPeerConnection(ICE_SERVERS);
        this.peerConnection = pc;
        pc.onicecandidate = (e) => {
            if (e.candidate) logToTerminal("ICE candidate: " + e.candidate.candidate);
            else logToTerminal("ICE Gathering Complete");
        };
        pc.onicegatheringstatechange = () => updateDebugInfo(pc.iceConnectionState, pc.iceGatheringState, pc.connectionState);
        pc.oniceconnectionstatechange = () => {
            updateDebugInfo(pc.iceConnectionState, pc.iceGatheringState, pc.connectionState);
            if (this.onStatusChange) this.onStatusChange(pc.iceConnectionState);
        };
        pc.onconnectionstatechange = () => updateDebugInfo(pc.iceConnectionState, pc.iceGatheringState, pc.connectionState);
        pc.ondatachannel = (event) => this.setupDataChannel(event.channel);
        this.localEphemeralKeyPair = await CryptoHelper.generateECDHKeyPair();
        await pc.setRemoteDescription(new RTCSessionDescription({type:'offer', sdp:offerData.sdp}));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await new Promise(resolve => {
            if (pc.iceGatheringState === 'complete') resolve();
            else {
                const timeout = setTimeout(() => { logToTerminal("ICE gathering timeout"); resolve(); }, 15000);
                pc.onicegatheringstatechange = () => { if(pc.iceGatheringState==='complete'){ clearTimeout(timeout); resolve(); } };
                pc.onicecandidate = (e) => { if(!e.candidate){ clearTimeout(timeout); resolve(); } };
            }
        });
        return { version:'1.0', type:'answer', sdp:pc.localDescription.sdp, senderIdentity: currentIdentity.identity, senderFingerprint: currentIdentity.fingerprint, timestamp: Date.now() };
    },
    async applyAnswer(answerData) {
        await this.peerConnection.setRemoteDescription(new RTCSessionDescription({type:'answer', sdp:answerData.sdp}));
    },
    setupDataChannel(dc) {
        this.dataChannel = dc;
        dc.onopen = async () => {
            this.stats.startTime = Date.now();
            if (this.localEphemeralKeyPair) {
                const pubBytes = await CryptoHelper.exportPublicKey(this.localEphemeralKeyPair);
                dc.send(JSON.stringify({type:'ephemeral-key', key: Array.from(pubBytes)}));
            }
            if (this.onStatusChange) this.onStatusChange('connected');
        };
        dc.onmessage = async (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.type === 'ephemeral-key') {
                    const remotePub = new Uint8Array(msg.key);
                    this.remoteEphemeralPublicKey = await CryptoHelper.importPublicKey(remotePub);
                    if (!this.localEphemeralKeyPair) throw new Error('Missing local ephemeral key pair');
                    this.sharedSecret = await CryptoHelper.deriveSharedSecret(this.localEphemeralKeyPair.privateKey, this.remoteEphemeralPublicKey);
                    this.aesKey = await CryptoHelper.deriveAESKey(this.sharedSecret);
                    this.sessionFingerprint = await CryptoHelper.sessionFingerprint(this.sharedSecret);
                    if (this.onMessage) this.onMessage({type:'session-established', fingerprint:this.sessionFingerprint});
                } else if (msg.type === 'encrypted') {
                    if (!this.aesKey) return;
                    const cipherBytes = new Uint8Array(atob(msg.data).split('').map(c=>c.charCodeAt(0)));
                    const plain = await CryptoHelper.decryptAES(this.aesKey, cipherBytes);
                    const inner = JSON.parse(plain);
                    if (this.onMessage) this.onMessage(inner);
                    this.stats.messages++; this.stats.recvBytes += event.data.length;
                }
            } catch(e) { logToTerminal('Decrypt error: '+e); }
        };
        dc.onclose = () => { if(this.onStatusChange) this.onStatusChange('disconnected'); };
        setInterval(()=>this.updateStats(), 1000);
    },
    async sendEncrypted(payloadObj) {
        if (!this.dataChannel || this.dataChannel.readyState!=='open' || !this.aesKey) return false;
        const plain = JSON.stringify(payloadObj);
        const cipher = await CryptoHelper.encryptAES(this.aesKey, plain);
        const b64 = btoa(String.fromCharCode(...cipher));
        this.dataChannel.send(JSON.stringify({type:'encrypted', data:b64}));
        this.stats.sentBytes += b64.length;
        return true;
    },
    close() {
        if(this.dataChannel) { this.dataChannel.close(); this.dataChannel=null; }
        if(this.peerConnection) { this.peerConnection.close(); this.peerConnection=null; }
        this.aesKey=null; this.sharedSecret=null; this.sessionFingerprint=null;
        this.localEphemeralKeyPair=null; this.remoteEphemeralPublicKey=null;
    },
    async updateStats() {
        if(!this.peerConnection) return;
        try {
            const stats = await this.peerConnection.getStats();
            stats.forEach(report => { if(report.type==='candidate-pair' && report.state==='succeeded') this.stats.rtt = Math.round(report.currentRoundTripTime*1000); });
        } catch(e) {}
        if(this.onStats) this.onStats(this.stats);
    }
};

// ==================== FILE TRANSFER ====================
const FileTransferManager = {
    CHUNK_SIZE: 65536,
    async sendFile(file, dcSendFn, onProgress) {
        const arrayBuffer = await file.arrayBuffer();
        const totalChunks = Math.ceil(arrayBuffer.byteLength / this.CHUNK_SIZE);
        const fileId = crypto.randomUUID();
        await dcSendFn({type:'file-meta', fileId, fileName:file.name, fileSize:file.size, mimeType:file.type, totalChunks});
        for (let i=0; i<totalChunks; i++) {
            const start = i*this.CHUNK_SIZE, end = Math.min(start+this.CHUNK_SIZE, arrayBuffer.byteLength);
            const chunk = arrayBuffer.slice(start, end);
            const base64 = btoa(String.fromCharCode(...new Uint8Array(chunk)));
            await dcSendFn({type:'file-chunk', fileId, index:i, data:base64});
            if (onProgress) onProgress({sent:i+1, total:totalChunks, fileName:file.name});
            await new Promise(r=>setTimeout(r,10));
        }
        await dcSendFn({type:'file-complete', fileId, fileName:file.name});
    },
    receivers: new Map(),
    handleFileMessage(msg, onFileProgress, onFileComplete) {
        switch(msg.type) {
            case 'file-meta':
                const receiver = { fileName:msg.fileName, fileSize:msg.fileSize, mimeType:msg.mimeType, totalChunks:msg.totalChunks, chunks:new Array(msg.totalChunks), received:0 };
                this.receivers.set(msg.fileId, receiver);
                if(onFileProgress) onFileProgress({received:0, total:msg.totalChunks, fileName:msg.fileName});
                break;
            case 'file-chunk':
                const recv = this.receivers.get(msg.fileId); if(!recv) return;
                const bytes = Uint8Array.from(atob(msg.data), c=>c.charCodeAt(0));
                recv.chunks[msg.index] = bytes; recv.received++;
                if(onFileProgress) onFileProgress({received:recv.received, total:recv.totalChunks, fileName:recv.fileName});
                break;
            case 'file-complete':
                const recv2 = this.receivers.get(msg.fileId); if(!recv2) return;
                const totalLen = recv2.chunks.reduce((s,c)=>s+c.byteLength, 0);
                const combined = new Uint8Array(totalLen); let off=0;
                for(const c of recv2.chunks) { combined.set(c,off); off+=c.byteLength; }
                const blob = new Blob([combined],{type:recv2.mimeType});
                const url = URL.createObjectURL(blob);
                if(onFileComplete) onFileComplete({fileName:recv2.fileName, fileSize:recv2.fileSize, url, mimeType:recv2.mimeType});
                this.receivers.delete(msg.fileId);
                break;
        }
    }
};

function refreshMessages() {
    const container = document.getElementById('messagesContainer');
    if(!container) return;
    container.innerHTML = ChatManager.messages.map(msg => {
        const side = msg.sender==='local' ? 'local' : 'remote';
        const time = new Date(msg.timestamp).toTimeString().slice(0,8);
        if(msg.type==='text') return `<div class="msg-bubble msg-${side}"><div class="msg-meta">${msg.sender==='local'?currentIdentity.identity:remoteIdentity} · ${time}</div>${escapeHtml(msg.content)}</div>`;
        else if(msg.type==='file') return `<div class="msg-bubble msg-${side}"><div class="msg-meta">${msg.sender==='local'?currentIdentity.identity:remoteIdentity} · ${time}</div><div class="msg-file">📎 ${msg.fileName} (${formatBytes(msg.fileSize)}) ${msg.downloadUrl?`<a href="${msg.downloadUrl}" download="${msg.fileName}" class="btn" style="padding:2px 8px;">${t('download')}</a>`:''}</div></div>`;
        return '';
    }).join('');
    container.scrollTop = container.scrollHeight;
}
function escapeHtml(t) { return String(t).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function formatBytes(b) { return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'; }
async function sendMessage() {
    const input = document.getElementById('chatInput'); const text = input.value.trim(); if(!text) return;
    const msg = {type:'text', id:crypto.randomUUID(), timestamp:Date.now(), content:text};
    const sent = await WebRTCManager.sendEncrypted({...msg, sender:'local'});
    if(sent) { msg.sender='local'; ChatManager.addMessage(msg); input.value=''; refreshMessages(); logToTerminal(t('messageSent')); }
}
async function sendFileFromInput(inputEl) {
    const file = inputEl.files[0]; if(!file) return;
    await startFileSend(file); inputEl.value='';
}
async function startFileSend(file) {
    const fileMsg = {type:'file', id:crypto.randomUUID(), timestamp:Date.now(), fileName:file.name, fileSize:file.size, sender:'local'};
    ChatManager.addMessage(fileMsg); refreshMessages();
    await FileTransferManager.sendFile(file, async(payload)=>await WebRTCManager.sendEncrypted({...payload, sender:'local'}));
    logToTerminal(t('fileSent')+': '+file.name);
}
WebRTCManager.onMessage = async (msg) => {
    if(msg.type==='session-established') {
        const fpEl = document.getElementById('sessionFp');
        if(fpEl) fpEl.textContent = `${t('sessionFingerprint')}: ${msg.fingerprint} [${t('verify')}]`;
        logToTerminal(t('sessionFingerprint')+': '+msg.fingerprint);
        return;
    }
    if(msg.type==='file-meta' || msg.type==='file-chunk' || msg.type==='file-complete') {
        FileTransferManager.handleFileMessage(msg,
            (prog)=>{},
            (fileInfo)=>{
                const fMsg = {type:'file', id:crypto.randomUUID(), timestamp:Date.now(), fileName:fileInfo.fileName, fileSize:fileInfo.fileSize, downloadUrl:fileInfo.url, sender:'remote'};
                ChatManager.addMessage(fMsg); refreshMessages();
                logToTerminal(t('fileReceived')+': '+fileInfo.fileName);
            });
    } else if(msg.type==='text') {
        const cMsg = {type:'text', id:msg.id, timestamp:msg.timestamp, content:msg.content, sender:'remote'};
        ChatManager.addMessage(cMsg); refreshMessages();
    }
};

function updateStatusDot(state) {
    const indicator = document.getElementById('statusIndicator');
    if(!indicator) return;
    let dotClass, text;
    if(state==='connected'||state==='completed') { dotClass='dot-connected'; text=t('connected'); }
    else if(state==='connecting'||state==='new'||state==='checking') { dotClass='dot-connecting'; text=t('connecting'); }
    else { dotClass='dot-disconnected'; text=t('disconnected'); }
    indicator.innerHTML = `<span class="status-dot ${dotClass}"></span> ${text}`;
}

    renderUI();
    logToTerminal(t('terminalReady'));
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => setLang(e.target.dataset.lang));
    });
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
