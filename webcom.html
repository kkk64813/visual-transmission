<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Chat Zero Server</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #16161f;
            --primary: #ff6a1a;
            --primary-glow: #ff8c42;
            --accent: #ff4d00;
            --text: #e0ddd5;
            --text2: #a09b90;
            --border: #2a2520;
            --danger: #ff3b3b;
            --success: #3bff8c;
            --warning: #ffb83b;
            --scanline: rgba(255, 106, 26, 0.03);
            --glass-bg: rgba(20, 18, 15, 0.7);
            --glass-border: rgba(255, 106, 26, 0.25);
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            --font-sans: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --hex-skew: 6deg;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Scanline overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    var(--scanline) 2px,
                    var(--scanline) 4px);
            opacity: 0.5;
        }

        /* Particle Canvas */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Main container */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            min-height: 580px;
            margin: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 0 80px rgba(255, 106, 26, 0.08), 0 0 200px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.02);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
            flex-shrink: 0;
            gap: 12px;
        }
        .app-header .logo {
            font-family: var(--font-mono);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(255, 106, 26, 0.5);
            white-space: nowrap;
        }
        .app-header .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Language Toggle */
        .lang-toggle {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            font-family: var(--font-mono);
            transition: all 0.3s;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
            white-space: nowrap;
        }
        .lang-toggle:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 16px rgba(255, 106, 26, 0.25);
        }

        /* Hex button base */
        .hex-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 20px;
            font-family: var(--font-mono);
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: 1.5px solid var(--primary);
            background: transparent;
            color: var(--primary);
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
            transition: all 0.3s;
            position: relative;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .hex-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 30px rgba(255, 106, 26, 0.5), 0 0 60px rgba(255, 106, 26, 0.2);
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
        }
        .hex-btn:active {
            transform: scale(0.96);
            transition: transform 0.1s;
        }
        .hex-btn.danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        .hex-btn.danger:hover {
            background: var(--danger);
            color: #000;
            box-shadow: 0 0 30px rgba(255, 59, 59, 0.5);
        }
        .hex-btn.secondary {
            border-color: var(--text2);
            color: var(--text2);
        }
        .hex-btn.secondary:hover {
            background: var(--text2);
            color: #000;
            box-shadow: 0 0 20px rgba(160, 155, 144, 0.3);
        }
        .hex-btn.small {
            padding: 6px 12px;
            font-size: 0.75rem;
            clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
        }

        /* Content area */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .app-content::-webkit-scrollbar {
            width: 4px;
        }
        .app-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .app-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* Glass input */
        .glass-input {
            background: var(--glass-bg);
            border: 1.5px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
            backdrop-filter: blur(8px);
            width: 100%;
            resize: vertical;
            min-height: 44px;
        }
        .glass-input:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 24px rgba(255, 106, 26, 0.2), 0 0 0 4px rgba(255, 106, 26, 0.04);
            background: rgba(25, 22, 18, 0.85);
        }
        .glass-input::placeholder {
            color: var(--text2);
            opacity: 0.6;
        }

        /* Textarea */
        textarea.glass-input {
            min-height: 100px;
            font-family: var(--font-mono);
            line-height: 1.5;
        }

        /* Card */
        .card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }
        .card-title {
            font-family: var(--font-mono);
            color: var(--primary-glow);
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        /* Terminal log */
        .terminal-log {
            background: #080810;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: #8b8;
            max-height: 180px;
            overflow-y: auto;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .terminal-log .log-warn {
            color: #fa3;
        }
        .terminal-log .log-info {
            color: #8bf;
        }
        .terminal-log .log-success {
            color: #8f8;
        }
        .terminal-log .log-error {
            color: #f66;
        }

        /* Chat messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 200px;
            max-height: 420px;
            padding: 4px;
        }
        .chat-msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
            animation: msgIn 0.3s ease;
        }
        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .chat-msg.sent {
            align-self: flex-end;
            background: rgba(255, 106, 26, 0.2);
            border: 1px solid rgba(255, 106, 26, 0.35);
            border-bottom-right-radius: 4px;
        }
        .chat-msg.received {
            align-self: flex-start;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .chat-msg .msg-time {
            font-size: 0.65rem;
            color: var(--text2);
            margin-top: 4px;
            text-align: right;
        }
        .chat-msg .msg-sender {
            font-size: 0.7rem;
            color: var(--primary-glow);
            font-family: var(--font-mono);
            margin-bottom: 2px;
        }
        .chat-msg img.msg-thumb {
            max-width: 200px;
            max-height: 160px;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            margin-top: 6px;
        }
        .chat-msg .file-download {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary-glow);
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            text-decoration: underline;
            margin-top: 4px;
        }

        /* QR container */
        .qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: #fff;
            border-radius: 8px;
            margin: 8px 0;
        }
        .qr-container canvas {
            display: block;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text2);
            padding: 8px 0;
            border-top: 1px solid var(--border);
        }
        .stats-bar span {
            background: var(--surface2);
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            white-space: nowrap;
        }
        .stats-bar .stat-val {
            color: var(--primary-glow);
            font-weight: 600;
        }

        /* File drop zone */
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            color: var(--text2);
            transition: all 0.3s;
            cursor: pointer;
        }
        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(255, 106, 26, 0.05);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface2);
            border: 1px solid var(--primary);
            color: var(--text);
            padding: 10px 22px;
            border-radius: 20px;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            z-index: 10000;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(255, 106, 26, 0.3);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .app-container {
                margin: 4px;
                border-radius: 10px;
                min-height: 100vh;
            }
            .hex-btn {
                padding: 8px 14px;
                font-size: 0.75rem;
                clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
            }
            .chat-msg {
                max-width: 92%;
            }
            .app-header {
                padding: 10px 14px;
            }
            .app-header .logo {
                font-size: 0.9rem;
            }
            .lang-toggle {
                padding: 5px 10px;
                font-size: 0.7rem;
            }
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Fingerprint display */
        .fingerprint {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--primary-glow);
            text-shadow: 0 0 12px rgba(255, 106, 26, 0.6);
            text-align: center;
            padding: 8px;
        }

        /* Identity card */
        .identity-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            flex-wrap: wrap;
        }
        .identity-card .avatar-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(255, 106, 26, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }
        .identity-card .id-info {
            flex: 1;
            min-width: 140px;
        }
        .identity-card .id-name {
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--text);
        }
        .identity-card .id-fp {
            font-size: 0.75rem;
            color: var(--text2);
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>

    <!-- Particle Background -->

    <!-- App Container -->
    <div class="app-container" id="appContainer">
        <!-- Header -->
        <div class="app-header">
            <span class="logo">⬡ SECRET CHAT ZS</span>
            <div class="header-actions">
                <button class="lang-toggle" id="langToggle" title="Switch Language / 切换语言">🌐 EN</button>
                <button class="hex-btn small secondary" id="btnHomeHeader" onclick="goHome()">⌂ <span data-i18n="home">首页</span></button>
            </div>
        </div>

        <!-- Content -->
        <div class="app-content" id="appContent">
            <!-- Dynamically filled -->
        </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="hiddenFileInput" style="display:none" multiple>
    <input type="file" id="hiddenSigFileInput" style="display:none" accept=".secretchat">

    <script>

        const i18nData = {

            },
            en: {
                home: 'Home',
                createChat: 'Create Chat',
                joinChat: 'Join Chat',
                back: 'Back',
                myIdentity: 'My Identity',
                nickname: 'Nickname',
                fingerprint: 'Fingerprint',
                createNewChat: 'Create New Chat',
                joinExistingChat: 'Join Existing Chat',

                generateQR: '📱 Generate QR Code',
                scanQR: '📱 Scan QR Code (camera needed)',
                localSignal: 'Local Signal Data',
                pasteSignalHere: 'Paste peer signal JSON here...',

                sendMessage: 'Type a message...',

                sessionFingerprint: 'Session Fingerprint',
                verifyFingerprint: 'Both parties verify fingerprint',
                stats: 'Connection Stats',
                rtt: 'RTT',
                bytesSent: 'Sent',
                bytesRecv: 'Received',
                msgCount: 'Messages',
                fileCount: 'Files',
                duration: 'Duration',
                dropFileHere: 'Drop files here or click to select',
                fileTooLarge: 'File too large (max 64MB)',
                qrTooLong: 'Signal data too long, use copy/paste or file instead',
                copied: 'Copied to clipboard',
                pasted: 'Pasted',
                fileSaved: 'File saved',
                fileLoaded: 'Signal file loaded',
                chatExported: 'Chat history exported',
                chatImported: 'Chat history imported',
                chatCleared: 'Chat history cleared',

                verifying: 'Verify session fingerprint...',
                fingerprintMatch: '✅ Fingerprint match, secure',
                fingerprintWarn: '⚠️ Fingerprint mismatch! MITM attack possible!',
                homeTitle: 'Secret Chat Zero Server',
                homeSubtitle: 'Fully Anonymous · E2E Encrypted · Zero Server',
                or: 'or',
                yourSignalData: 'Your Signal Data',
                waitingForAnswer: 'Waiting for peer to join...',
                pleasePaste: 'Please paste peer signal data',
                scanQrTitle: 'Scan Peer QR Code',
                generatingQr: 'Generating QR Code...',
                close: 'Close',
                qrModalTitle: 'Signal QR Code',
            }
        };

        let currentLang = localStorage.getItem('sczs_lang') || 'zh';

        function t(key) {
            return i18nData[currentLang]?.[key] || i18nData['en'][key] || key;
        }

        function switchLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('sczs_lang', currentLang);
            document.getElementById('langToggle').textContent = currentLang === 'zh' ? '🌐 EN' : '🌐 中文';
            refreshUI();
            showToast(currentLang === 'zh' ? '已切换为中文' : 'Switched to English');
        }

        function refreshUI() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.getAttribute('data-i18n'));
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
            });
            // Update current page
            const page = document.getElementById('appContent').dataset.page;
            if (page === 'home') renderHome();
            else if (page === 'create') renderCreate();
            else if (page === 'join') renderJoin();
            else if (page === 'chat') updateChatUI();
        }

        document.getElementById('langToggle').addEventListener('click', switchLang);
        document.getElementById('langToggle').textContent = currentLang === 'zh' ? '🌐 EN' : '🌐 中文';

        // ==================== TOAST ====================
        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ==================== PARTICLES ====================
        const particleCanvas = document.getElementById('particleCanvas');
        const pCtx = particleCanvas.getContext('2d');
        let particles = [];

        function resizeParticleCanvas() {
            particleCanvas.width = window.innerWidth;
            particleCanvas.height = window.innerHeight;
        }
        resizeParticleCanvas();
        window.addEventListener('resize', resizeParticleCanvas);

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * particleCanvas.width;
                this.y = Math.random() * particleCanvas.height;
                this.size = Math.random() * 1.8 + 0.3;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.5 + 0.15;
                this.fadeSpeed = Math.random() * 0.005 + 0.002;
                this.growing = Math.random() > 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.growing) {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 0.6) this.growing = false;
                } else {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0.08) this.growing = true;
                }
                if (this.x < -10 || this.x > particleCanvas.width + 10 ||

            const EXP_TABLE = new Uint8Array(512);

            (function initGF() {

                if (a === 0 || b === 0) return 0;

                const res = new Uint8Array(p1.length + p2.length - 1);
                for (let i = 0; i < p1.length; i++) {

                addLog('Answer created, gathering ICE candidates...', 'info');

                    buildAnswerSignal();

                    navigator.clipboard.writeText(jsonStr).then(() => showToast(t('copied')));

        async function scanQR() {
            // Use browser QR scanner if available (BarcodeDetector API)
            if ('BarcodeDetector' in window) {
                try {
                    const formats = await BarcodeDetector.getSupportedFormats();
                    if (formats.includes('qr_code')) {
                        const detector = new BarcodeDetector({ formats: ['qr_code'] });
                        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                        const video = document.createElement('video');
                        video.srcObject = stream;
                        video.play();
                        const scanInterval = setInterval(async () => {
                            if (video.readyState >= 2) {
                                const barcodes = await detector.detect(video);
                                if (barcodes.length > 0) {
                                    clearInterval(scanInterval);
                                    stream.getTracks().forEach(t => t.stop());
                                    const text = barcodes[0].rawValue;
                                    const inputEl = document.getElementById('peerSignalInput');
                                    if (inputEl) { inputEl.value = text;
                                        showToast(t('pasted')); } else {
                                        showToast('QR scanned: ' + text.slice(0, 50) + '...');
                                    }
                                }
                            }
                        }, 300);
                        showToast('Scanning QR code... Point camera at QR code.');
                        setTimeout(() => { clearInterval(scanInterval);
                            stream.getTracks().forEach(t => t.stop()); }, 30000);
                        return;
                    }
                } catch (e) { /* fallback */ }
            }
            // Fallback: use file input to scan QR image
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.onchange = async function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(img.src);
                    // Try BarcodeDetector on the canvas
                    if ('BarcodeDetector' in window) {
                        try {
                            const detector = new BarcodeDetector({ formats: ['qr_code'] });
                            const barcodes = await detector.detect(canvas);
                            if (barcodes.length > 0) {
                                const text = barcodes[0].rawValue;
                                const inputEl = document.getElementById('peerSignalInput');
                                if (inputEl) { inputEl.value = text;
                                    showToast('QR code scanned!'); }
                                return;
                            }
                        } catch (e) {}
                    }
                    showToast('Could not read QR code from image. Try copy/paste instead.');
                };
            };
            fileInput.click();
        }

        // ==================== PEER CONNECTION SETUP ====================
        async function setupPeerConnection(initiator) {
            peerConnection = new RTCPeerConnection({ iceServers: ICE_SERVERS });

            peerConnection.oniceconnectionstatechange = () => {
                const state = peerConnection.iceConnectionState;
                addLog('ICE state: ' + state, state === 'connected' ? 'success' : state === 'failed' ? 'error' :
                    'info');
                if (state === 'failed') {
                    addLog(t('connectionFailed') + '. Check network/firewall.', 'error');
                }
                if (state === 'disconnected') {
                    addLog(t('peerDisconnected'), 'warn');
                }
            };

            peerConnection.onconnectionstatechange = () => {
                const state = peerConnection.connectionState;
                if (state === 'connected') {
                    if (!connectionStats.startTime) connectionStats.startTime = Date.now();
                    addLog(t('connected') + '!', 'success');
                }
            };

            if (initiator) {
                dataChannel = peerConnection.createDataChannel('secretchat', {
                    ordered: true,
                });
                setupDataChannel(dataChannel);
            } else {
                peerConnection.ondatachannel = (event) => {
                    dataChannel = event.channel;
                    setupDataChannel(dataChannel);
                };
            }
        }

        function setupDataChannel(dc) {
            dc.onopen = () => {
                addLog('Data channel open!', 'success');
                if (!connectionStats.startTime) connectionStats.startTime = Date.now();
                // If we have both keys, derive session
                if (peerECDHPublicKey && sessionECDHKeyPair && !aesSessionKey) {
                    deriveSessionKeys();
                }
                // Send identity via encrypted channel (first message is key exchange confirmation)
                setTimeout(() => sendEncryptedSystemMessage('identity_broadcast', {
                    nickname: getOrCreateIdentity().nickname,
                    fingerprint: localStorage.getItem('sczs_identity_fp') || '',
                }), 500);
                // Update UI if in chat
                updateChatUIStatus();
            };
            dc.onclose = () => {
                addLog('Data channel closed.', 'warn');
                updateChatUIStatus();
            };
            dc.onerror = (e) => {
                addLog('Data channel error.', 'error');
            };
            dc.onmessage = async (event) => {
                if (event.data instanceof ArrayBuffer) {
                    await handleEncryptedBinaryMessage(new Uint8Array(event.data));
                } else if (typeof event.data === 'string') {
                    await handleEncryptedTextMessage(event.data);
                } else {
                    // Blob
                    const ab = await event.data.arrayBuffer();
                    await handleEncryptedBinaryMessage(new Uint8Array(ab));
                }
            };
        }

        async function deriveSessionKeys() {
            if (!sessionECDHKeyPair || !peerECDHPublicKey) return;
            try {
                const sharedSecret = await deriveSharedSecret(sessionECDHKeyPair.privateKey, peerECDHPublicKey);
                const salt = new Uint8Array(16); // Zero salt for simplicity (shared secret already unique)
                aesSessionKey = await deriveAESKey(sharedSecret, salt);
                sessionFingerprint = await computeSessionFingerprint(aesSessionKey);
                addLog('Session keys derived!', 'success');
                addLog('Session fingerprint: ' + formatFingerprint(sessionFingerprint), 'success');
                // Update chat UI if visible
                updateChatUIFingerprint();
                // Send confirmation
                if (dataChannel && dataChannel.readyState === 'open') {
                    await sendEncryptedSystemMessage('key_exchange_complete', { fingerprint: sessionFingerprint });
                }
            } catch (e) {
                addLog('Key derivation error: ' + e.message, 'error');
            }
        }

        function formatFingerprint(fp) {
            if (!fp) return '----';
            return fp.match(/.{1,4}/g).join('-');
        }

        async function sendEncryptedSystemMessage(type, data) {
            if (!aesSessionKey || !dataChannel || dataChannel.readyState !== 'open') return;
            const msg = JSON.stringify({ type, data, timestamp: Date.now(), system: true });
            try {
                const encrypted = await encryptMessage(aesSessionKey, msg);
                const b64 = btoa(String.fromCharCode(...encrypted));
                dataChannel.send(b64);
                connectionStats.bytesSent += b64.length;
            } catch (e) {
                addLog('Send error: ' + e.message, 'error');
            }
        }

        async function handleEncryptedTextMessage(b64) {
            if (!aesSessionKey) {
                // Try to parse as plaintext (key exchange might not be complete)
                try {
                    const msg = JSON.parse(b64);
                    if (msg.type === 'key_exchange_complete' && msg.data?.fingerprint) {
                        // This shouldn't happen if encrypted, but handle gracefully
                    }
                } catch (e) {}
                return;
            }
            try {
                const binary = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
                connectionStats.bytesRecv += b64.length;
                const plaintext = await decryptMessage(aesSessionKey, binary);
                const msg = JSON.parse(plaintext);
                await processDecryptedMessage(msg);
            } catch (e) {
                addLog('Decrypt error: ' + e.message, 'error');
            }
        }

        async function handleEncryptedBinaryMessage(data) {
            if (!aesSessionKey) return;
            try {
                connectionStats.bytesRecv += data.length;
                const plainData = await decryptBinary(aesSessionKey, data);
                // Parse as JSON
                const plaintext = new TextDecoder().decode(plainData);
                const msg = JSON.parse(plaintext);
                await processDecryptedMessage(msg);
            } catch (e) {
                addLog('Binary decrypt error: ' + e.message, 'error');
            }
        }

        async function processDecryptedMessage(msg) {
            if (msg.system) {
                if (msg.type === 'key_exchange_complete') {
                    addLog('Peer session fingerprint: ' + formatFingerprint(msg.data?.fingerprint), 'info');
                    if (msg.data?.fingerprint && sessionFingerprint) {
                        if (msg.data.fingerprint === sessionFingerprint) {
                            addLog(t('fingerprintMatch'), 'success');
                        } else {
                            addLog(t('fingerprintWarn'), 'error');
                        }
                    }
                }
                if (msg.type === 'identity_broadcast') {
                    peerIdentity = msg.data;
                    addLog('Peer: ' + (msg.data?.nickname || 'Unknown'), 'info');
                    updateChatUIPeerIdentity();
                }
                if (msg.type === 'ping') {
                    // Respond with pong
                    await sendEncryptedSystemMessage('pong', { origTimestamp: msg.data?.timestamp });
                }
                if (msg.type === 'pong') {
                    const now = Date.now();
                    const sent = msg.data?.origTimestamp || connectionStats.lastPingTime;
                    connectionStats.rtt = now - sent;
                    connectionStats.pingPending = false;
                    updateStatsDisplay();
                }
                return;
            }
            // Regular message
            if (msg.type === 'text') {
                chatHistory.push({ ...msg, direction: 'received' });
                connectionStats.msgCount++;
                appendChatMessage(msg, 'received');
            } else if (msg.type === 'file_info') {
                chatHistory.push({ ...msg, direction: 'received' });
                connectionStats.fileCount++;
                pendingFileChunks[msg.data.fileId] = {
                    info: msg.data,
                    chunks: new Array(msg.data.totalChunks),
                    receivedCount: 0,
                };
                appendChatMessage(msg, 'received');
            } else if (msg.type === 'file_chunk') {
                const pending = pendingFileChunks[msg.data.fileId];
                if (pending && !pending.chunks[msg.data.chunkIndex]) {
                    pending.chunks[msg.data.chunkIndex] = msg.data.chunkData;
                    pending.receivedCount++;
                    // Update progress
                    updateFileProgress(msg.data.fileId, pending.receivedCount, pending.info.totalChunks);
                    if (pending.receivedCount === pending.info.totalChunks) {
                        // Complete
                        const fullB64 = pending.chunks.join('');
                        const binary = Uint8Array.from(atob(fullB64), c => c.charCodeAt(0));
                        const blob = new Blob([binary], { type: pending.info.mimeType });
                        const url = URL.createObjectURL(blob);
                        finalizeFileMessage(msg.data.fileId, url, pending.info);
                        delete pendingFileChunks[msg.data.fileId];
                    }
                }
            }
            updateStatsDisplay();
        }

        async function sendEncryptedMessage(type, data) {
            if (!aesSessionKey || !dataChannel || dataChannel.readyState !== 'open') {
                showToast('Not connected');
                return false;
            }
            const msg = JSON.stringify({ type, data, timestamp: Date.now() });
            try {
                const encrypted = await encryptMessage(aesSessionKey, msg);
                const b64 = btoa(String.fromCharCode(...encrypted));
                dataChannel.send(b64);
                connectionStats.bytesSent += b64.length;
                connectionStats.msgCount++;
                updateStatsDisplay();
                return true;
            } catch (e) {
                addLog('Send error: ' + e.message, 'error');
                return false;
            }
        }

        async function sendEncryptedBinary(type, data) {
            if (!aesSessionKey || !dataChannel || dataChannel.readyState !== 'open') {
                showToast('Not connected');
                return false;
            }
            const msg = JSON.stringify({ type, data, timestamp: Date.now() });
            try {
                const encoded = new TextEncoder().encode(msg);
                const encrypted = await encryptBinary(aesSessionKey, encoded);
                dataChannel.send(encrypted.buffer);
                connectionStats.bytesSent += encrypted.length;
                updateStatsDisplay();
                return true;
            } catch (e) {
                addLog('Binary send error: ' + e.message, 'error');
                return false;
            }
        }

        // ==================== RENDER: CHAT ====================
        function renderChat() {
            const content = document.getElementById('appContent');
            content.dataset.page = 'chat';
            if (!connectionStats.startTime) connectionStats.startTime = Date.now();
            const id = getOrCreateIdentity();

            content.innerHTML = `
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-family:var(--font-mono);color:var(--primary-glow);">⬡ Encrypted Chat</span>
              <span style="font-size:0.7rem;color:var(--text2);" id="chatPeerLabel">${peerIdentity?.nickname || 'Peer'}</span>
              <span style="flex:1;"></span>
              <span class="fingerprint" id="sessionFpDisplay" style="font-size:0.8rem;">${formatFingerprint(sessionFingerprint)}</span>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div style="display:flex;gap:8px;align-items:flex-end;">
              <textarea class="glass-input" id="chatInput" placeholder="${t('sendMessage')}" style="min-height:44px;flex:1;resize:none;" rows="1"></textarea>
              <button class="hex-btn" id="btnSend">${t('send')}</button>
            </div>
            <div class="drop-zone" id="dropZone">${t('dropFileHere')}</div>
            <div class="stats-bar" id="statsBar">
              <span>${t('rtt')}: <span class="stat-val" id="statRtt">--</span>ms</span>
              <span>${t('bytesSent')}: <span class="stat-val" id="statSent">0</span></span>
              <span>${t('bytesRecv')}: <span class="stat-val" id="statRecv">0</span></span>
              <span>${t('msgCount')}: <span class="stat-val" id="statMsgs">0</span></span>
              <span>${t('fileCount')}: <span class="stat-val" id="statFiles">0</span></span>
              <span>${t('duration')}: <span class="stat-val" id="statDur">00:00</span></span>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
              <button class="hex-btn small secondary" id="btnClearChat">${t('clearChat')}</button>
              <button class="hex-btn small secondary" id="btnExportChat">${t('exportChat')}</button>
              <button class="hex-btn small secondary" id="btnImportChat">${t('importChat')}</button>
              <button class="hex-btn small secondary" id="btnVerifyFp">🔍 ${t('verifyFingerprint')}</button>
              <button class="hex-btn small danger" id="btnDisconnect" onclick="goHome()">✕ ${t('disconnected')}</button>
              <button class="hex-btn small secondary" onclick="goHome()">⌂ ${t('home')}</button>
            </div>
            <div class="terminal-log" id="terminalLog" style="max-height:100px;"></div>
          `;

            // Restore chat history
            chatHistory.forEach(msg => appendChatMessage(msg, msg.direction || 'sent'));

            // Event listeners
            const chatInput = document.getElementById('chatInput');
            chatInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendTextMessage();
                }
            });
            document.getElementById('btnSend').addEventListener('click', sendTextMessage);
            document.getElementById('btnClearChat').addEventListener('click', clearChat);
            document.getElementById('btnExportChat').addEventListener('click', exportChatHistory);
            document.getElementById('btnImportChat').addEventListener('click', importChatHistory);
            document.getElementById('btnVerifyFp').addEventListener('click', verifyFingerprint);

            // Drop zone
            const dropZone = document.getElementById('dropZone');
            dropZone.addEventListener('click', () => document.getElementById('hiddenFileInput').click());
            dropZone.addEventListener('dragover', (e) => { e.preventDefault();
                dropZone.classList.add('drag-over'); });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                handleFiles(e.dataTransfer.files);
            });
            document.getElementById('hiddenFileInput').addEventListener('change', (e) => {
                handleFiles(e.target.files);
                e.target.value = '';
            });

            updateStatsDisplay();
            updateChatUIFingerprint();
            updateChatUIPeerIdentity();
            startPingInterval();
            startDurationTimer();
        }

        function updateChatUI() {
            // Refresh UI text elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.getAttribute('data-i18n'));
            });
            const dropZone = document.getElementById('dropZone');
            if (dropZone) dropZone.textContent = t('dropFileHere');
            const chatInput = document.getElementById('chatInput');
            if (chatInput) chatInput.placeholder = t('sendMessage');
            updateStatsDisplay();
        }

        function updateChatUIStatus() {
            const dcState = dataChannel?.readyState;
            const statusEl = document.getElementById('chatPeerLabel');
            if (statusEl) {
                statusEl.textContent = (peerIdentity?.nickname || 'Peer') +
                    (dcState === 'open' ? ' [' + t('connected') + ']' : ' [' + t('disconnected') + ']');
            }
        }

        function updateChatUIFingerprint() {
            const fpEl = document.getElementById('sessionFpDisplay');
            if (fpEl && sessionFingerprint) {
                fpEl.textContent = formatFingerprint(sessionFingerprint);
            }
        }

        function updateChatUIPeerIdentity() {
            const labelEl = document.getElementById('chatPeerLabel');
            if (labelEl && peerIdentity) {
                labelEl.textContent = peerIdentity.nickname + ' [' + t('connected') + ']';
            }
        }

        function appendChatMessage(msg, direction) {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            const div = document.createElement('div');
            div.className = 'chat-msg ' + (direction === 'sent' ? 'sent' : 'received');
            const time = new Date(msg.timestamp).toLocaleTimeString();
            let inner = '';
            if (direction === 'received' && peerIdentity) {
                inner += `<div class="msg-sender">${peerIdentity.nickname}</div>`;
            }
            if (msg.type === 'text') {
                inner += `<div>${escapeHtml(msg.data)}</div>`;
            } else if (msg.type === 'file_info') {
                const isImage = msg.data.mimeType?.startsWith('image/');
                inner += `<div>📎 ${escapeHtml(msg.data.fileName)} (${formatSize(msg.data.fileSize)})</div>`;
                if (isImage && msg.data.thumbnailB64) {
                    inner +=
                        `<img class="msg-thumb" src="data:${msg.data.mimeType};base64,${msg.data.thumbnailB64}" alt="thumbnail" onclick="window.open(this.src)">`;
                }
                inner +=
                    `<div class="file-download" data-fileid="${msg.data.fileId}" style="color:var(--primary-glow);">⬇ ${direction==='received'?'Download':'Sent'} (${msg.data.totalChunks} chunks)</div>`;
                if (direction === 'received') {
                    inner +=
                        `<div class="file-progress" id="fp-${msg.data.fileId}" style="font-size:0.7rem;color:var(--text2);">Waiting...</div>`;
                }
            }
            inner += `<div class="msg-time">${time}</div>`;
            div.innerHTML = inner;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            // Add download handler for received files that are already complete
            if (direction === 'received' && msg.type === 'file_info') {
                const downloadEl = div.querySelector('.file-download');
                if (downloadEl && msg.data._completeUrl) {
                    downloadEl.addEventListener('click', () => {
                        const a = document.createElement('a');
                        a.href = msg.data._completeUrl;
                        a.download = msg.data.fileName;
                        a.click();
                    });
                }
            }
        }

        function updateFileProgress(fileId, received, total) {
            const progEl = document.getElementById('fp-' + fileId);
            if (progEl) {
                progEl.textContent = `Receiving: ${received}/${total} chunks (${Math.round(received/total*100)}%)`;
            }
        }

        function finalizeFileMessage(fileId, url, info) {
            const progEl = document.getElementById('fp-' + fileId);
            if (progEl) {
                progEl.textContent = 'Complete! Click to download ⬆';
                progEl.style.color = 'var(--success)';
            }
            // Find the file_info message in chatHistory and update
            const msg = chatHistory.find(m => m.type === 'file_info' && m.data?.fileId === fileId);
            if (msg) {
                msg.data._completeUrl = url;
                msg.data._complete = true;
            }
            // Update download link
            const container = document.getElementById('chatMessages');
            if (container) {
                const downloadEls = container.querySelectorAll('.file-download');
                downloadEls.forEach(el => {
                    if (el.dataset.fileid === fileId) {
                        el.textContent = '⬇ Download';
                        el.style.cursor = 'pointer';
                        el.addEventListener('click', () => {
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = info.fileName;
                            a.click();
                        });
                    }
                });
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        async function sendTextMessage() {
            const input = document.getElementById('chatInput');
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;
            const msg = { type: 'text', data: text, timestamp: Date.now() };
            const success = await sendEncryptedMessage('text', text);
            if (success) {
                chatHistory.push({ ...msg, direction: 'sent' });
                appendChatMessage(msg, 'sent');
                input.value = '';
            }
        }

        async function handleFiles(files) {
            for (const file of files) {
                if (file.size > 64 * 1024 * 1024) {
                    showToast(t('fileTooLarge'));
                    continue;
                }
                const fileId = crypto.randomUUID();
                const totalChunks = Math.ceil(file.size / (64 * 1024));
                const reader = new FileReader();

                // Generate thumbnail for images
                let thumbnailB64 = null;
                if (file.type.startsWith('image/')) {
                    try {
                        thumbnailB64 = await generateThumbnail(file);
                    } catch (e) { /* ignore */ }
                }

                // Send file_info
                const fileInfo = {
                    fileId,
                    fileName: file.name,
                    fileSize: file.size,
                    mimeType: file.type,
                    totalChunks,
                    thumbnailB64,
                };
                await sendEncryptedMessage('file_info', fileInfo);
                const infoMsg = { type: 'file_info', data: fileInfo, timestamp: Date.now() };
                chatHistory.push({ ...infoMsg, direction: 'sent' });
                appendChatMessage(infoMsg, 'sent');
                connectionStats.fileCount++;

                // Read and send chunks
                const chunkSize = 64 * 1024;
                for (let i = 0; i < totalChunks; i++) {
                    const start = i * chunkSize;
                    const end = Math.min(start + chunkSize, file.size);
                    const slice = file.slice(start, end);
                    const chunkB64 = await new Promise((resolve) => {
                        const r = new FileReader();
                        r.onload = () => {
                            const bytes = new Uint8Array(r.result);
                            resolve(btoa(String.fromCharCode(...bytes)));
                        };
                        r.readAsArrayBuffer(slice);
                    });
                    const chunkMsg = {
                        fileId,
                        chunkIndex: i,
                        chunkData: chunkB64,
                        totalChunks,
                    };
                    await sendEncryptedBinary('file_chunk', chunkMsg);
                    // Small delay to avoid overwhelming the channel
                    await new Promise(r => setTimeout(r, 20));
                }
                addLog(`File sent: ${file.name} (${totalChunks} chunks)`, 'success');
            }
        }

        function generateThumbnail(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxDim = 160;
                    let w = img.width,
                        h = img.height;
                    if (w > h) { w = maxDim;
                        h = (img.height / img.width) * maxDim; } else { h = maxDim;
                        w = (img.width / img.height) * maxDim; }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const b64 = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];
                    URL.revokeObjectURL(img.src);
                    resolve(b64);
                };
                img.onerror = reject;
            });
        }

        function clearChat() {
            chatHistory = [];
            const container = document.getElementById('chatMessages');
            if (container) container.innerHTML = '';
            connectionStats.msgCount = 0;
            connectionStats.fileCount = 0;
            updateStatsDisplay();
            showToast(t('chatCleared'));
        }

        function exportChatHistory() {
            const blob = new Blob([JSON.stringify(chatHistory, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'secretchat-history-' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast(t('chatExported'));
        }

        function importChatHistory() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (Array.isArray(imported)) {
                            chatHistory = imported;
                            // Refresh display
                            const container = document.getElementById('chatMessages');
                            if (container) {
                                container.innerHTML = '';
                                chatHistory.forEach(msg => appendChatMessage(msg, msg.direction || 'received'));
                            }
                            connectionStats.msgCount = chatHistory.filter(m => m.type === 'text').length;
                            connectionStats.fileCount = chatHistory.filter(m => m.type === 'file_info').length;
                            updateStatsDisplay();
                            showToast(t('chatImported'));
                        }
                    } catch (e) {
                        showToast('Invalid chat history file');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function verifyFingerprint() {
            if (!sessionFingerprint) {
                showToast('No active session');
                return;
            }
            const fpFormatted = formatFingerprint(sessionFingerprint);
            const msg = t('verifyFingerprint') + ':\n\n' + fpFormatted +
                '\n\n' + t('verifying');
            if (confirm(msg)) {
                showToast(t('fingerprintMatch'));
            } else {
                showToast(t('fingerprintWarn'));
            }
        }

        function updateStatsDisplay() {
            const rttEl = document.getElementById('statRtt');
            const sentEl = document.getElementById('statSent');
            const recvEl = document.getElementById('statRecv');
            const msgsEl = document.getElementById('statMsgs');
            const filesEl = document.getElementById('statFiles');
            if (rttEl) rttEl.textContent = connectionStats.rtt || '--';
            if (sentEl) sentEl.textContent = formatSize(connectionStats.bytesSent);
            if (recvEl) recvEl.textContent = formatSize(connectionStats.bytesRecv);
            if (msgsEl) msgsEl.textContent = connectionStats.msgCount;
            if (filesEl) filesEl.textContent = connectionStats.fileCount;
        }

        let durationInterval = null;

        function startDurationTimer() {
            if (durationInterval) clearInterval(durationInterval);
            durationInterval = setInterval(() => {
                const durEl = document.getElementById('statDur');
                if (durEl && connectionStats.startTime) {
                    const elapsed = Math.floor((Date.now() - connectionStats.startTime) / 1000);
                    const mins = Math.floor(elapsed / 60);
                    const secs = elapsed % 60;
                    durEl.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                }
            }, 1000);
        }

        let pingInterval = null;

        function startPingInterval() {
            if (pingInterval) clearInterval(pingInterval);
            pingInterval = setInterval(async () => {
                if (dataChannel && dataChannel.readyState === 'open' && aesSessionKey && !connectionStats
                    .pingPending) {
                    connectionStats.pingPending = true;
                    connectionStats.lastPingTime = Date.now();
                    await sendEncryptedSystemMessage('ping', { timestamp: connectionStats.lastPingTime });
                }
            }, 5000);
        }

        // ==================== INITIALIZATION ====================
        async function init() {
            const fp = await getIdentityFingerprint();
            document.getElementById('langToggle').textContent = currentLang === 'zh' ? '🌐 EN' : '🌐 中文';
            renderHome();
            // Setup hidden file input for signal import
            document.getElementById('hiddenSigFileInput').addEventListener('change', handleSigFileImport);
            // Handle page unload
            window.addEventListener('beforeunload', () => {
                if (dataChannel) dataChannel.close();
                if (peerConnection) peerConnection.close();
            });
        }

        // Handle the case where chat needs to be rendered after connection
        function enterChat() {
            renderChat();
            addLog('Entered encrypted chat room.', 'success');
            if (sessionFingerprint) {
                addLog('Session FP: ' + formatFingerprint(sessionFingerprint), 'info');
            }
        }

        // Override deriveSessionKeys to auto-enter chat
        const originalDeriveSessionKeys = deriveSessionKeys;
        deriveSessionKeys = async function() {
            await originalDeriveSessionKeys();
            // Check if we should enter chat
            if (document.getElementById('appContent').dataset.page === 'create' ||
                document.getElementById('appContent').dataset.page === 'join') {
                if (dataChannel && dataChannel.readyState === 'open' && aesSessionKey) {
                    enterChat();
                }
            }
        };

        // Also listen for data channel open to enter chat
        const originalSetupDataChannel = setupDataChannel;
        setupDataChannel = function(dc) {
            originalSetupDataChannel(dc);
            const origOnOpen = dc.onopen;
            dc.onopen = function() {
                if (origOnOpen) origOnOpen.call(this);
                if (!connectionStats.startTime) connectionStats.startTime = Date.now();
                if (document.getElementById('appContent').dataset.page === 'create' ||
                    document.getElementById('appContent').dataset.page === 'join') {
                    if (aesSessionKey) {
                        setTimeout(() => enterChat(), 300);
                    } else if (peerECDHPublicKey && sessionECDHKeyPair) {
                        deriveSessionKeys().then(() => {
                            setTimeout(() => enterChat(), 300);
                        });
                    }
                }
            };
        };

        // Start the app
        init().catch(e => {
            document.getElementById('appContent').innerHTML =
                `<div style="color:var(--danger);padding:20px;">Initialization error: ${e.message}</div>`;
            console.error(e);
        });

        console.log('⬡ Secret Chat Zero Server - Ready');
        console.log('Identity:', getOrCreateIdentity().nickname);
        console.log('Fingerprint:', localStorage.getItem('sczs_identity_fp') || 'Generating...');
    </script>
